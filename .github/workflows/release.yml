name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o "surge2egern-$GOOS-$GOARCH" .
          # Windows needs .exe
          if [ "$GOOS" = "windows" ]; then
            mv "surge2egern-$GOOS-$GOARCH" "surge2egern-$GOOS-$GOARCH.exe"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: surge2egern-${{ matrix.goos }}-${{ matrix.goarch }}
          path: surge2egern-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          cd out && shasum -a 256 * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
